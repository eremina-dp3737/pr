<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=/, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding:0;
            margin: 0;
            box-sizing: border-box;

        }
        body{
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        header {
            color:black;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 1px 1px 20px darkgrey;
            border-bottom-left-radius: 17px;
            border-bottom-right-radius: 17px;
        }
        h1 {
            font-weight: bold;
        }
        button {
            height: 30px;
            width: 90px;
            font-size: 11px;
            background-color: blue;
            color: aliceblue;
            border-radius: 16px;
        }
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .banner {
            display: flex;
            justify-content: center;
            flex-direction: column;
            height: 200px;
            width: 925px;
            border-radius: 15px;

        }
    </style>
</head>
<body>
    <header>
        <h1>OZON</h1>
        <button>КОРЗИНА</button>
    </header>
    <main>
        <div class="banner">
            <img src="Снимок экрана 2026-09-28 в 12.54.59.png" alt="">
        </div>
    </main>
    <footer></footer>

</body>
</html>
